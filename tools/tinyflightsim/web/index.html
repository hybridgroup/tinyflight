<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinyflight Sim</title>
<meta name="description" content="Fly real M5Stack Stampfly firmware in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tinyflight.app/">
<meta property="og:title" content="Tinyflight Sim">
<meta property="og:description" content="Fly real M5Stack Stampfly firmware in your browser.">
<meta property="og:image" content="https://tinyflight.app/social.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<!-- Static hosts like GitHub Pages cannot set the headers SharedArrayBuffer needs, so this service worker adds them. -->
<script src="coi-serviceworker.js"></script>
<script type="importmap">
{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/"}}
</script>
</head>
<body>
<header>
  <h1>Tinyflight Sim</h1>
  <span id="status" class="pill">starting</span>
  <nav class="links">
    <a href="https://github.com/hybridgroup/tinyflight" target="_blank" rel="noopener">Tinyflight on GitHub</a>
    <a href="https://shop.m5stack.com/products/m5stamp-fly-v1-1-with-m5stamps3a" target="_blank" rel="noopener">Get an M5Stamp Fly</a>
  </nav>
  <div class="tools">
    <button id="restart" title="Power cycle the drone. Rebuilds the firmware if the sources changed.">Restart</button>
    <button id="pause">Pause</button>
    <label>Speed
      <select id="speed">
        <option value="25">0.25×</option>
        <option value="50">0.5×</option>
        <option value="100" selected>1×</option>
      </select>
    </label>
    <button id="random-terrain" title="Make new random terrain and restart the drone on it.">Random terrain</button>
    <button id="flat" title="Go back to a flat floor and restart the drone.">Flat</button>
    <label>Camera
      <select id="camera">
        <option value="chase" selected>Chase</option>
        <option value="pilot">Pilot</option>
        <option value="orbit">Orbit</option>
      </select>
    </label>
    <button id="sound-toggle" title="Turn the motor sound on or off.">Sound off</button>
    <button id="controller-toggle" title="Map the axes and buttons of a gamepad or joystick.">Controller</button>
    <button id="console-toggle">Console</button>
  </div>
</header>
<main>
  <canvas id="view"></canvas>
  <dl id="hud">
    <dt>Status</dt><dd id="hud-armed">-</dd>
    <dt>Mode</dt><dd id="hud-mode">-</dd>
    <dt>Failsafe</dt><dd id="hud-failsafe">-</dd>
    <dt>Height</dt><dd id="hud-height">-</dd>
    <dt>Estimate</dt><dd id="hud-est">-</dd>
    <dt>Speed</dt><dd id="hud-speed">-</dd>
    <dt>Battery</dt><dd id="hud-battery">-</dd>
    <dt>Time</dt><dd id="hud-time">-</dd>
  </dl>
  <div id="joystick"></div>
  <section id="controller" hidden></section>
  <section id="console" hidden>
    <pre id="console-text"></pre>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
